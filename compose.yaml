
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ronditrack
      POSTGRES_USER: ronditrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ronditrack -d ronditrack"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: ronditrack-migrations:6.4
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__RondiTrack: "Host=db;Port=5432;Database=ronditrack;Username=ronditrack;Password=${POSTGRES_PASSWORD}"
      Jwt__Issuer: ${JWT_ISSUER:?Set JWT_ISSUER in .env}
      Jwt__Audience: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in .env}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}

  api:
    image: ronditrack-api:7.3
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__RondiTrack: "Host=db;Port=5432;Database=ronditrack;Username=ronditrack;Password=${POSTGRES_PASSWORD}"
      Jwt__Issuer: ${JWT_ISSUER:?Set JWT_ISSUER in .env}
      Jwt__Audience: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in .env}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}

volumes:
  postgres_data:
